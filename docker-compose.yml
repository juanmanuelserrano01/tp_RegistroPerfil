services:
  db:
    image: mysql:8.0
    container_name: mi_banco_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mi_banco_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mi_banco_db.sql:/docker-entrypoint-initdb.d/mi_banco_db.sql

  web:
    image: php:8.2-apache
    container_name: mi_banco_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
